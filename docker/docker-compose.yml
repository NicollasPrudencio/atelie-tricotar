services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/var/www/html
    environment:
      - PHP_IDE_CONFIG=serverName=atelie.local
    depends_on:
      - db

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ..:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: atelie
      MARIADB_USER: atelie
      MARIADB_PASSWORD: atelie
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_USER: atelie
      PMA_PASSWORD: atelie
    ports:
      - "8080:80"
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025" # UI web
      - "1025:1025" # SMTP

volumes:
  db_data:
