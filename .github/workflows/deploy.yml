name: Deploy

# Pipeline em 2 estagios, 100% automatico (ver docs/decisions/0001, secao "Pipeline CI/CD"):
# push em develop -> lint/testes -> deploy em homolog -> teste de stress/fumaca (k6) contra o
# homolog JA NO AR -> se passar, promove develop -> main sozinho -> lint/testes de novo -> deploy
# em producao. Sem aprovacao manual em nenhum ponto — quem usa o pipeline so precisa dar
# commit/push em develop; o resto (incluindo a decisao de virar candidato a producao) e o
# pipeline que decide, com base no teste de stress passar ou nao. Hospedagem: HostGator
# compartilhado, cPanel, so SFTP (sem SSH), PHP ate 8.2 via seletor do cPanel — por isso o build
# roda aqui no runner, o servidor so recebe arquivos prontos.

on:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      - name: Auditoria de seguranca das dependencias
        run: composer audit --abandoned=report

      - name: Lint (WordPress Coding Standards)
        run: composer run lint

      - name: Testes unitarios
        if: false # habilita quando tests/unit/phpunit.xml existir (Fase 1+)
        env:
          AI_MOCK_MODE: "true"
        run: composer run test:unit

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2" # mesma versao definida no seletor de PHP do cPanel para este dominio
          tools: composer:v2

      - name: Instalar dependencias de producao
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Gerar .env de homolog a partir dos secrets
        run: |
          cat > .env <<EOF
          WP_ENV=staging
          WP_HOME=${{ secrets.WP_HOME }}
          WP_SITEURL=${{ secrets.WP_HOME }}/wp
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          AUTH_KEY=${{ secrets.AUTH_KEY }}
          SECURE_AUTH_KEY=${{ secrets.SECURE_AUTH_KEY }}
          LOGGED_IN_KEY=${{ secrets.LOGGED_IN_KEY }}
          NONCE_KEY=${{ secrets.NONCE_KEY }}
          AUTH_SALT=${{ secrets.AUTH_SALT }}
          SECURE_AUTH_SALT=${{ secrets.SECURE_AUTH_SALT }}
          LOGGED_IN_SALT=${{ secrets.LOGGED_IN_SALT }}
          NONCE_SALT=${{ secrets.NONCE_SALT }}
          AI_VISION_PROVIDER=${{ secrets.AI_VISION_PROVIDER }}
          AI_VISION_API_KEY=${{ secrets.AI_VISION_API_KEY }}
          AI_MOCK_MODE=false
          AI_BATCH_MAX_ITEMS=${{ secrets.AI_BATCH_MAX_ITEMS }}
          MERCADOPAGO_PUBLIC_KEY=${{ secrets.MERCADOPAGO_PUBLIC_KEY }}
          MERCADOPAGO_ACCESS_TOKEN=${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_SANDBOX=true
          MELHORENVIO_TOKEN=${{ secrets.MELHORENVIO_TOKEN }}
          MELHORENVIO_SANDBOX=true
          STORE_ADDRESS="${{ secrets.STORE_ADDRESS }}"
          STORE_CITY="${{ secrets.STORE_CITY }}"
          STORE_STATE="${{ secrets.STORE_STATE }}"
          STORE_POSTCODE="${{ secrets.STORE_POSTCODE }}"
          WPSCAN_API_TOKEN=${{ secrets.WPSCAN_API_TOKEN }}
          DISABLE_WP_CRON=true
          NFE_EMISSAO_ATIVA=false
          GOOGLE_DRIVE_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET=${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          META_PIXEL_ID=${{ secrets.META_PIXEL_ID }}
          META_CAPI_ACCESS_TOKEN=${{ secrets.META_CAPI_ACCESS_TOKEN }}
          GA4_MEASUREMENT_ID=${{ secrets.GA4_MEASUREMENT_ID }}
          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          EOF

      # Bedrock exige vendor/ e config/ como IRMAOS de web/ (wp-config.php faz
      # require dirname(__DIR__) . '/vendor/autoload.php' e '/config/application.php')
      # — sem esses dois, o site cai com erro fatal assim que o PHP tenta subir.
      # APP_REMOTE_PATH e a pasta-raiz PRIVADA (fora do document root) onde tudo
      # isso mora; o document root real e so um symlink pra dentro de APP_REMOTE_PATH/web
      # (configurado uma vez via SSH, nao faz parte deste pipeline).
      #
      # Envia tudo como UM .tar.gz em vez de arquivo por arquivo via SFTP puro —
      # o WordPress core sozinho tem milhares de arquivos pequenos, e SFTP
      # transferindo um por um leva minutos. Compactar local + extrair remoto via
      # SSH cai pra segundos. Decisao consciente: amarra o deploy ao SSH liberado
      # nesta hospedagem especifica (ver docs/acesso-ssh-dev.md) — se um dia trocar
      # pra host sem SSH, revisitar isso e voltar pro SFTP puro por arquivo.
      - name: Compactar vendor/, config/, web/ e .env
        run: tar -czf deploy.tar.gz vendor config web .env

      # appleboy/scp-action embrulha o source num tar PROPRIO antes de enviar
      # (log mostra "tar all files into /tmp/<random>.tar.gz"), e na pratica o
      # deploy.tar.gz nao aparecia no /tmp remoto depois (confirmado testando
      # SCP/SSH manual com a mesma chave, que funcionou perfeito) — troca pra
      # wlixcc/SFTP-Deploy-Action pro upload (ja provado confiavel pra
      # arquivo/pasta especifico) e mantem o ssh-action so pra extrair.
      - name: Enviar deploy.tar.gz via SFTP para homolog
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          ssh_private_key: ${{ secrets.SFTP_SSH_PRIVATE_KEY }}
          local_path: "./deploy.tar.gz"
          remote_path: /tmp
          sftpArgs: "-o ConnectTimeout=10"

      - name: Extrair deploy.tar.gz no servidor via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          key: ${{ secrets.SFTP_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SFTP_PORT }}
          script: |
            set -e
            echo "Confirmando que o tarball chegou:"
            ls -la /tmp/deploy.tar.gz
            mkdir -p "${{ secrets.APP_REMOTE_PATH }}"
            tar -xzf /tmp/deploy.tar.gz -C "${{ secrets.APP_REMOTE_PATH }}"
            rm -f /tmp/deploy.tar.gz
            echo "Conferindo resultado da extracao:"
            ls -la "${{ secrets.APP_REMOTE_PATH }}"

  stress-test:
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging # sem isso, secrets.WP_HOME nao pega o valor configurado no environment staging
    steps:
      - uses: actions/checkout@v7

      - name: Teste de stress/fumaca contra homolog (k6)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/stress/homolog.js
        env:
          BASE_URL: ${{ secrets.WP_HOME }}

  promote-to-main:
    needs: stress-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      # Push feito com o GITHUB_TOKEN automatico do Actions NUNCA dispara outro
      # workflow (protecao proposital do GitHub contra loop infinito de workflow
      # chamando workflow) — por isso usa um Personal Access Token proprio
      # (PROMOTE_TOKEN, fine-grained, so Contents:Read-and-write neste repo) pra
      # esse checkout especifico, senao deploy-production nunca dispara sozinho.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN }}

      - name: Promover develop -> main (dispara o deploy de producao abaixo)
        run: git push origin HEAD:main

  deploy-production:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Instalar dependencias de producao
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Gerar .env de producao a partir dos secrets
        run: |
          cat > .env <<EOF
          WP_ENV=production
          WP_HOME=${{ secrets.WP_HOME }}
          WP_SITEURL=${{ secrets.WP_HOME }}/wp
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          AUTH_KEY=${{ secrets.AUTH_KEY }}
          SECURE_AUTH_KEY=${{ secrets.SECURE_AUTH_KEY }}
          LOGGED_IN_KEY=${{ secrets.LOGGED_IN_KEY }}
          NONCE_KEY=${{ secrets.NONCE_KEY }}
          AUTH_SALT=${{ secrets.AUTH_SALT }}
          SECURE_AUTH_SALT=${{ secrets.SECURE_AUTH_SALT }}
          LOGGED_IN_SALT=${{ secrets.LOGGED_IN_SALT }}
          NONCE_SALT=${{ secrets.NONCE_SALT }}
          AI_VISION_PROVIDER=${{ secrets.AI_VISION_PROVIDER }}
          AI_VISION_API_KEY=${{ secrets.AI_VISION_API_KEY }}
          AI_MOCK_MODE=false
          AI_BATCH_MAX_ITEMS=${{ secrets.AI_BATCH_MAX_ITEMS }}
          MERCADOPAGO_PUBLIC_KEY=${{ secrets.MERCADOPAGO_PUBLIC_KEY }}
          MERCADOPAGO_ACCESS_TOKEN=${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_SANDBOX=${{ secrets.MERCADOPAGO_SANDBOX }}
          MELHORENVIO_TOKEN=${{ secrets.MELHORENVIO_TOKEN }}
          MELHORENVIO_SANDBOX=${{ secrets.MELHORENVIO_SANDBOX }}
          STORE_ADDRESS="${{ secrets.STORE_ADDRESS }}"
          STORE_CITY="${{ secrets.STORE_CITY }}"
          STORE_STATE="${{ secrets.STORE_STATE }}"
          STORE_POSTCODE="${{ secrets.STORE_POSTCODE }}"
          WPSCAN_API_TOKEN=${{ secrets.WPSCAN_API_TOKEN }}
          DISABLE_WP_CRON=true
          NFE_EMISSAO_ATIVA=${{ secrets.NFE_EMISSAO_ATIVA }}
          NFE_PROVEDOR=${{ secrets.NFE_PROVEDOR }}
          NFE_PROVEDOR_TOKEN=${{ secrets.NFE_PROVEDOR_TOKEN }}
          GOOGLE_DRIVE_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET=${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          META_PIXEL_ID=${{ secrets.META_PIXEL_ID }}
          META_CAPI_ACCESS_TOKEN=${{ secrets.META_CAPI_ACCESS_TOKEN }}
          GA4_MEASUREMENT_ID=${{ secrets.GA4_MEASUREMENT_ID }}
          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          EOF

      - name: Compactar vendor/, config/, web/ e .env
        run: tar -czf deploy.tar.gz vendor config web .env

      - name: Enviar deploy.tar.gz via SFTP para producao
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          ssh_private_key: ${{ secrets.SFTP_SSH_PRIVATE_KEY }}
          local_path: "./deploy.tar.gz"
          remote_path: /tmp
          sftpArgs: "-o ConnectTimeout=10"

      - name: Extrair deploy.tar.gz no servidor via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          key: ${{ secrets.SFTP_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SFTP_PORT }}
          script: |
            set -e
            echo "Confirmando que o tarball chegou:"
            ls -la /tmp/deploy.tar.gz
            mkdir -p "${{ secrets.APP_REMOTE_PATH }}"
            tar -xzf /tmp/deploy.tar.gz -C "${{ secrets.APP_REMOTE_PATH }}"
            rm -f /tmp/deploy.tar.gz
            echo "Conferindo resultado da extracao:"
            ls -la "${{ secrets.APP_REMOTE_PATH }}"

      - name: Notificar falha de deploy
        if: failure()
        run: echo "Deploy de producao falhou — ver logs deste run. (Notificacao por e-mail/Slack entra quando o canal for definido.)"
