title: Manual do Painel — Ateliê Tricotar
description: Guia de uso do painel administrativo do site do Ateliê Tricotar — para quem cadastra produtos e para quem administra o site.
baseurl: "/atelie-tricotar"
url: "https://nicollasprudencio.github.io"

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

color_scheme: light
search_enabled: true
heading_anchors: true
nav_sort: default

aux_links:
  "Repositório no GitHub":
    - "https://github.com/NicollasPrudencio/atelie-tricotar"
aux_links_new_tab: true

footer_content: "Manual vivo, atualizado a cada funcionalidade nova do painel."

back_to_top: true
back_to_top_text: "Voltar ao topo"

lang: pt-BR

# Sem isso, nenhuma pagina aplica o layout do tema (nem CSS, nem menu lateral,
# nem busca) — cai no HTML cru, sem nenhum wrapper.
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
